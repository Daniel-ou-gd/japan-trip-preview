<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日本6天自由行 - 景点预览</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f4ee;
      --panel: #fffaf2;
      --text: #202124;
      --muted: #6b6258;
      --line: #ded5c9;
      --accent: #0f766e;
      --accent-strong: #115e59;
      --map: #2563eb;
      --photo: #c2410c;
      --copy: #4b5563;
      --shadow: 0 12px 28px rgba(42, 34, 22, 0.08);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg);
      line-height: 1.55;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      border-bottom: 1px solid var(--line);
      background: rgba(247, 244, 238, 0.96);
      backdrop-filter: blur(14px);
    }

    .wrap {
      width: min(1120px, calc(100% - 28px));
      margin: 0 auto;
    }

    .topbar {
      padding: 18px 0 14px;
    }

    h1 {
      margin: 0 0 4px;
      font-size: clamp(22px, 4.8vw, 34px);
      letter-spacing: 0;
    }

    .subtitle {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr);
      gap: 10px;
      padding: 0 0 14px;
    }

    .search {
      width: 100%;
      height: 44px;
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 0 12px;
      color: var(--text);
      background: #fff;
      font-size: 16px;
      outline: none;
    }

    .search:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.16);
    }

    .filters {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chip {
      min-width: 52px;
      height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 14px;
      color: var(--text);
      background: #fff;
      font: inherit;
      white-space: nowrap;
      cursor: pointer;
    }

    .chip.active {
      border-color: var(--accent);
      color: #fff;
      background: var(--accent);
    }

    main {
      padding: 18px 0 36px;
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
      color: var(--muted);
      font-size: 14px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 14px;
    }

    .card {
      display: flex;
      flex-direction: column;
      min-height: 310px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .preview {
      display: grid;
      place-items: center;
      position: relative;
      min-height: 150px;
      padding: 0;
      color: #fff;
      background:
        linear-gradient(135deg, rgba(15, 118, 110, 0.95), rgba(37, 99, 235, 0.78)),
        linear-gradient(45deg, rgba(255, 255, 255, 0.12) 25%, transparent 25%, transparent 50%, rgba(255, 255, 255, 0.12) 50%, rgba(255, 255, 255, 0.12) 75%, transparent 75%);
      background-size: auto, 34px 34px;
      text-align: center;
      overflow: hidden;
    }

    .preview::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.12), rgba(0, 0, 0, 0.52));
    }

    .preview img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .preview-label {
      position: relative;
      z-index: 1;
      width: 100%;
      padding: 18px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.55);
    }

    .preview strong {
      display: block;
      font-size: 22px;
      line-height: 1.2;
    }

    .preview span {
      display: block;
      margin-top: 6px;
      font-size: 13px;
      opacity: 0.92;
    }

    .body {
      display: flex;
      flex: 1;
      flex-direction: column;
      gap: 10px;
      padding: 14px;
    }

    .meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .day {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      border-radius: 999px;
      padding: 4px 10px;
      color: var(--accent-strong);
      background: rgba(15, 118, 110, 0.12);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .index {
      color: var(--muted);
      font-size: 13px;
    }

    h2 {
      margin: 0;
      font-size: 20px;
      line-height: 1.28;
      letter-spacing: 0;
    }

    .alias {
      margin: -4px 0 0;
      color: var(--muted);
      font-size: 14px;
    }

    .info {
      display: grid;
      gap: 5px;
      margin: 0;
      color: var(--muted);
      font-size: 14px;
    }

    .info div {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
      margin-top: auto;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      border-radius: 8px;
      padding: 8px 10px;
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      text-align: center;
      border: 0;
      font: inherit;
      cursor: pointer;
    }

    .btn.map {
      background: var(--map);
    }

    .btn.photo {
      background: var(--photo);
    }

    .btn.copy {
      grid-column: 1 / -1;
      background: var(--copy);
    }

    .empty {
      display: none;
      border: 1px dashed var(--line);
      border-radius: 8px;
      padding: 28px;
      color: var(--muted);
      background: rgba(255, 250, 242, 0.75);
      text-align: center;
    }

    @media (min-width: 760px) {
      .controls {
        grid-template-columns: 280px minmax(0, 1fr);
        align-items: center;
      }

      .topbar {
        padding-top: 24px;
      }
    }

    @media (max-width: 420px) {
      .wrap {
        width: min(100% - 20px, 1120px);
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="wrap topbar">
      <h1>日本6天自由行景点预览</h1>
      <p class="subtitle">手机、iPad、安卓浏览器可直接打开；点击按钮跳转地图或携程景点页。</p>
    </div>
    <div class="wrap controls">
      <input id="search" class="search" type="search" placeholder="搜索景点、地址、行程日" autocomplete="off">
      <nav class="filters" aria-label="按行程日筛选">

        <button class="chip" type="button" data-day="D2">D2</button>

  </header>

    </div>

        image: "https://dimg04.c-ctrip.com/images/0106l12000kichsih9E60_W_640_10000.jpg?proc=crop/m_c,w_2500,h_1666,x_0,y_0,A7E3"

    const grid = document.querySelector("#grid");
    const empty = document.querySelector("#empty");
    const count = document.querySelector("#count");
    const search = document.querySelector("#search");
    const chips = [...document.querySelectorAll(".chip")];
    let activeDay = "all";

    function cardTemplate(spot) {
      const haystack = `${spot.name} ${spot.alias} ${spot.address} ${spot.coord} ${spot.time}`;
      return `
        <article class="card" data-day="${spot.day}" data-text="${haystack.toLowerCase()}">
          <div class="preview">
            <img src="${spot.image}" alt="${spot.name}实景图" loading="lazy">
            <div class="preview-label">
              <strong>${spot.name}</strong>
              <span>${spot.alias}</span>
            </div>
          </div>
          <div class="body">
            <div class="meta">
              <span class="day">${spot.time}</span>
              <span class="index">#${spot.id}</span>
            </div>
            <h2>${spot.name}</h2>
            <p class="alias">${spot.alias}</p>
            <div class="info">
              <div><strong>地址：</strong>${spot.address}</div>
              <div><strong>坐标：</strong>${spot.coord}</div>
            </div>
            <div class="actions">
              <a class="btn map" href="${spot.map}">打开地图</a>
              <a class="btn photo" href="${spot.photo}">携程实景</a>
              <button class="btn copy" type="button" data-copy="${spot.name}">复制景点名</button>
            </div>
          </div>
        </article>
      `;
    }

    function render() {
      const keyword = search.value.trim().toLowerCase();
      let visible = 0;

      [...grid.children].forEach((card) => {
        const matchesDay = activeDay === "all" || card.dataset.day === activeDay;
        const matchesText = !keyword || card.dataset.text.includes(keyword);
        const show = matchesDay && matchesText;
        card.hidden = !show;
        if (show) visible += 1;
      });

      count.textContent = `当前显示 ${visible} / ${spots.length} 个景点`;
      empty.style.display = visible === 0 ? "block" : "none";
    }

    grid.innerHTML = spots.map(cardTemplate).join("");
    search.addEventListener("input", render);
    chips.forEach((chip) => {
      chip.addEventListener("click", () => {
        activeDay = chip.dataset.day;
        chips.forEach((item) => item.classList.toggle("active", item === chip));
        render();
      });
    });
    grid.addEventListener("click", async (event) => {
      const button = event.target.closest("[data-copy]");
      if (!button) return;

      const text = button.dataset.copy;
      try {
        await navigator.clipboard.writeText(text);
        button.textContent = "已复制";
      } catch (error) {
        window.prompt("复制这个景点名到携程或浏览器搜索", text);
      }

      window.setTimeout(() => {
        button.textContent = "复制景点名";
      }, 1600);
    });
    render();
  </script>
</body>
</html>
